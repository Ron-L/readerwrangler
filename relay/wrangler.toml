name = "readerwrangler-relay"
main = "relay-worker.js"
compatibility_date = "2024-09-25"

[vars]
ALLOWED_ORIGINS = "https://www.amazon.com,https://readerwrangler.com,https://ron-l.github.io,http://localhost:8000"
CF_ACCOUNT_ID = "fd7a55c08920584561205e24b2d7eeae"
# Which deployment this is — relay-worker.js's RELAYS table (worker names + namespace ids mirror this file).
RELAY_ENV = "prod"
# 7.23.0 - the nightly storage cleanup: "delete" removes leftovers (within a per-run budget); anything else only REPORTS
# what it would delete. Production reported until dev had proven deleting; flipped 2026-10-20 (Ron's yes) — 7.23.0.
CLEANUP = "delete"

# "*/30" = threshold alerts (prod only) = THRESHOLD_CRON; "55 23" = the daily summary = SUMMARY_CRON (relay-worker.js).
# Change both places together: a schedule the worker doesn't recognize does nothing (it's reported as a problem).
[triggers]
crons = ["*/30 * * * *", "55 23 * * *"]

[[kv_namespaces]]
binding = "RELAY_KV"
id = "4a445b412fb34860a896cfc145a67b9b"
preview_id = "4a445b412fb34860a896cfc145a67b9b"

# --- Dev environment (Phase 0, relay write redesign) ---
# Deploy with: npx wrangler deploy --env dev
# Separate worker + separate KV namespace; production data is never touched.
# Vars are NOT inherited by an env — every var is repeated here.
[env.dev]
name = "readerwrangler-relay-dev"

[env.dev.vars]
ALLOWED_ORIGINS = "https://www.amazon.com,https://readerwrangler.com,https://ron-l.github.io,http://localhost:8000"
CF_ACCOUNT_ID = "fd7a55c08920584561205e24b2d7eeae"
RELAY_ENV = "dev"
# 7.23.0 - dev deletes first (see the top-level CLEANUP note).
CLEANUP = "delete"

# 7.22.0: dev sends its own daily summary (subject "[Dev] …": usage for both relays + a check of dev's storage).
# Dev never sends threshold alerts. Each schedule runs only its own job (relay-worker.js SUMMARY_CRON / THRESHOLD_CRON);
# any other schedule does nothing but gets counted, in red, in the next summary. To test the summary, don't add a
# schedule (Cloudflare can take hours to apply one): POST /run-summary?key=<TEST_ALERT_KEY> sends it immediately.
[env.dev.triggers]
crons = ["55 23 * * *"]

[[env.dev.kv_namespaces]]
binding = "RELAY_KV"
id = "58116108eead40d18a55e59d799472b3"
preview_id = "58116108eead40d18a55e59d799472b3"
